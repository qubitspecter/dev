<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How secure do you actually want to be?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --font-family-sans: Arial, "Helvetica Neue", Helvetica, sans-serif; }
        body { font-family: var(--font-family-sans); background: var(--bs-tertiary-bg); }
        .quiz-card { border-radius: 1.25rem; }
        .opt { text-align: left; white-space: normal; }
        .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--bs-primary); outline-offset: 2px; }
        .ladder .active { font-weight: 700; }
    </style>
</head>
<body>
<main class="container py-5" style="max-width: 720px;">
    <header class="text-center mb-4">
        <h1 class="fw-bold display-6 mb-2">How secure do you actually want to be?</h1>
        <p class="text-body-secondary mb-0">Ten quick, slightly cheeky questions. No wrong answers, only consequences.</p>
    </header>
    <div id="app" aria-live="polite"></div>
</main>

<script>
/* Points: 0 General Conversation, 1 SMB1001 Silver, 2 SMB1001 Gold, 3 E8 ML1, 4 VeriState.
   role "q9" / "q10" / "q11" answers adjust the result instead of scoring. */
const Q = [
 {q:`What's your take on phishing training?`, a:[
  [`Love it. Watching Brenda in accounts click the "free iPad" link never gets old.`,1],
  [`Humans will always click things. Can we make clicking harmless instead?`,4],
  [`Keep the training, but please don't make it our only plan.`,2]]},
 {q:`Staff want to log in to our cloud apps and SharePoint from their own home computers. Your answer?`, a:[
  [`No! Company devices only, and I'm keeping the receipts.`,2],
  [`Yes! Their computer, their problem.`,0],
  [`Yes, but through a controlled session: they can view and edit, nothing downloads or copies to the home computer, and access ends when they leave.`,4]]},
 {q:`How should your computers decide what's safe to run?`, a:[
  [`A guard with a book of known troublemakers. If it's not in the book, it's probably fine.`,1],
  [`A guest list. If you're not on it, you don't get in.`,3],
  [`The guest list, plus extra locks on the usual tricks (dodgy Office macros, sneaky scripts).`,4],
  [`I assumed antivirus was handling all of this.`,0]]},
 {q:`AI can now break into a system and move through it at machine speed. No typing, no coffee breaks, and it can all be over before anyone notices. How worried are you?`, a:[
  [`Not very. Someone will notice and shut it down.`,1],
  [`Very. Humans can't react that fast, so the protection has to be in place before it starts.`,4],
  [`I'm worried now. Thanks for that.`,2]]},
 {q:`Who should decide when someone gets to change your business systems?`, a:[
  [`IT. They know best, so let them hold the keys and get on with it.`,1],
  [`IT, but they borrow the keys for each job, say why, and hand them back when it's done.`,3],
  [`The business. Changing the systems we run on is a business decision, so someone accountable approves it first.`,4]]},
 {q:`Someone deletes or scrambles all your cloud data tomorrow. How do you want to get it back?`, a:[
  [`Microsoft looks after it. Surely.`,1],
  [`A separate copy that can't be changed or deleted, even by us, and even by an attacker with admin rights.`,4],
  [`We have backups, I think. Nobody has tried restoring them.`,0]]},
 {q:`And the small stuff: who sees which folders, who is a local admin, which apps can read your data, and what happens to a hijacked account. How do you want it handled?`, a:[
  [`Defaults are fine. Microsoft knows best.`,0],
  [`Whatever the compliance checklist says, no more and no less.`,2],
  [`Tight by default: people see only what they need, nobody is a local admin, apps need approval, and risky accounts are fixed automatically.`,4]]},
 {role:`q9`, q:`Do you care if you get hacked?`, a:[
  [`Yes. A serious breach could bankrupt me.`,0],
  [`Yes, and I want my insurance to actually pay out when I claim.`,0],
  [`Meh. I just want to stay out of personal liability.`,0]]},
 {role:`q10`, q:`When you're secure, do you want something to frame?`, a:[
  [`Yes. Customers and tenders ask for it, and it looks lovely on the wall.`,0],
  [`No. I'd rather be secure than look secure.`,0],
  [`Only if it comes free with actually being secure.`,0]]},
 {role:`q11`, q:`How often do you want to be able to show that your security is in good shape?`, a:[
  [`Daily. Live, all the time.`,0],
  [`On demand, whenever an insurer, customer or auditor asks.`,0],
  [`Quarterly.`,0],
  [`Once a year, and honestly I'd rather not think about it.`,0]]}
];

const R = [
 {n:`General Conversation`, t:`Let's just have a chat`,
  b:`You're not against security, you just haven't had a reason to dig in yet. That's fine. No quiz can fix that, but a conversation can.`,
  l:[`Where does your business data actually live?`,`Who can get in, and what happens when someone does?`,`What would one bad Monday cost you?`]},
 {n:`SMB1001 Silver`, t:`The sensible minimum`,
  b:`You want to be insurable and not embarrassed in front of customers. Silver is built for that: solid identity basics, MFA on email, individual accounts and email authentication.`,
  l:[`Insurers and customers recognise it`,`Attested by a director, so no auditor is needed`,`Gold is the next step up when you're ready`]},
 {n:`SMB1001 Gold`, t:`Reasonable, and proud of it`,
  b:`Gold adds the grown-up parts: endpoint detection on every device, enforced email authentication, an incident plan and cyber insurance.`,
  l:[`A best-practice story for customers and insurers`,`Governance counts as much as tools: policies, an asset register, training`,`Still attested by a director`]},
 {n:`Essential Eight ML1`, t:`The Essential Eight person`,
  b:`You like locking things down: only approved apps run, macros are tamed, admin rights are scarce, patches land on time, and MFA and backups are in place.`,
  l:[`Application control and patching are the heavy lifts`,`ML1 doesn't require phishing-resistant MFA, so there's headroom above it`,`Pairs well with SMB1001 Gold for the policy side`]},
 {n:`VeriState suite`, t:`Deterministic or nothing`,
  b:`A written policy is not a control. You want things enforced and provable: passkeys for everyone, borrowed admin rights with approvals, app control and immutable backups.`,
  l:[`24 controls across Deterministic Access, Zero Admin, Execution Control and Hardened Environment`,`A control passes only when the problem is completely resolved`,`Evidence you can pull up daily or on demand`]}
];

const NOTE10 = [
 `You like a certificate on the wall. SMB1001 is the one that hands those out.`,
 `You want the real thing, not the badge. A VeriState report shows what is actually enforced.`,
 `Certificate if it's free with the real thing: the evidence report covers both.`];
const NOTE11 = [
 `Daily evidence means continuous checks, not an annual form.`,
 `On-demand evidence means a live report you can pull up when someone asks.`,
 `Quarterly is a sensible rhythm for a proper review.`,
 `Annual attestation suits SMB1001, but it only shows how you looked once a year.`];

const app = document.getElementById('app');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let i = 0, ans = [];

function show() {
  const q = Q[i], pct = Math.round(i / Q.length * 100);
  app.innerHTML = `
    <div class="progress mb-3" style="height:.5rem" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card quiz-card shadow-sm"><div class="card-body p-4">
      ${q.k ? `<div class="small text-body-secondary mb-2">${esc(q.k)}</div>` : ''}
      <h2 class="h4 fw-bold mb-4">${esc(q.q)}</h2>
      <div class="list-group">${q.a.map((o, n) => `<button type="button" class="list-group-item list-group-item-action opt py-3" data-n="${n}">${esc(o[0])}</button>`).join('')}</div>
      <div class="d-flex justify-content-between align-items-center mt-4">
        <button type="button" id="back" class="btn btn-outline-secondary btn-sm rounded-pill px-3" ${i ? '' : 'disabled'}>Back</button>
        <span class="small text-body-secondary">${i + 1} of ${Q.length}</span>
      </div></div></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => { ans[i] = +b.dataset.n; i++; i < Q.length ? show() : result(); });
  document.getElementById('back').onclick = () => { i--; show(); };
}

function result() {
  const sc = [], f = {};
  Q.forEach((q, n) => { if (q.role) f[q.role] = ans[n]; else sc.push(q.a[ans[n]][1]); });
  const avg = sc.reduce((a, b) => a + b, 0) / sc.length;
  let L = avg < .75 ? 0 : avg < 1.5 ? 1 : avg < 2.5 ? 2 : avg < 3.5 ? 3 : 4;
  L = Math.max(0, Math.min(4, L + [1, 1, 0, -1][f.q11]));
  if (f.q9 <= 1) L = Math.max(L, 1);
  const r = R[L];
  app.innerHTML = `
    <div class="card quiz-card shadow-sm mb-4"><div class="card-body p-4">
      <p class="text-body-secondary mb-1">Your result</p>
      <h2 class="display-6 fw-bold mb-1">${esc(r.n)}</h2>
      <p class="h5 text-body-secondary mb-3">${esc(r.t)}</p>
      <p>${esc(r.b)}</p>
      <ul class="mb-4">${r.l.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <p class="mb-1">${esc(NOTE10[f.q10])}</p>
      <p class="mb-0">${esc(NOTE11[f.q11])}</p>
    </div></div>
    <ul class="list-group ladder mb-4">${R.map((x, n) => `<li class="list-group-item${n === L ? ' active' : ''}">${esc(x.n)}</li>`).join('')}</ul>
    <div class="text-center">
      <p class="small text-body-secondary">Average control score: ${avg.toFixed(1)} out of 4</p>
      <button type="button" id="again" class="btn btn-primary rounded-pill px-4">Start again</button>
    </div>`;
  document.getElementById('again').onclick = () => { i = 0; ans = []; show(); };
}

show();
</script>
</body>
</html>
